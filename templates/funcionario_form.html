{% extends "base.html" %}

{% block titulo %}Funcionário{% endblock %}

{% block conteudo %}
    <h1>{{ "Editar Funcionário" if funcionario else "Novo Funcionário" }}</h1>

   <form method="POST" class="formulario">
        <label>Nome:</label><br>
        <input type="text" name="nome" maxlength="100" value="{{ funcionario.nome if funcionario }}" required><br><br>

        <label>E-mail:</label><br>
        <input type="email" name="email" maxlength="100" value="{{ funcionario.email if funcionario }}" required><br><br>

        <label>Departamento:</label><br>
        <input type="text" name="departamento" maxlength="50" value="{{ funcionario.departamento if funcionario }}"><br><br>

        <label>Cargo:</label><br>
        <input type="text" name="cargo" maxlength="50" value="{{ funcionario.cargo if funcionario }}"><br><br>

        <button type="submit">Salvar</button>
        <a href="{{ url_for('listar_funcionarios') }}">Cancelar</a>
    </form>
{% endblock %}
